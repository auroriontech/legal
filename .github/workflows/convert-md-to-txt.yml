name: Convert Markdown to Plain Text

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - '*.md'
      - '!README.md'  # Exclude README.md

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert AURORION-EULA-IOS.md to txt
        if: hashFiles('AURORION-EULA-IOS.md') != ''
        run: |
          pandoc AURORION-EULA-IOS.md -f markdown -t plain -o AURORION-EULA-IOS.txt --wrap=none

      - name: Convert AURORION-PRIVACY-IOS.md to txt
        if: hashFiles('AURORION-PRIVACY-IOS.md') != ''
        run: |
          pandoc AURORION-PRIVACY-IOS.md -f markdown -t plain -o AURORION-PRIVACY-IOS.txt --wrap=none

      - name: Convert AURORION-EULA-WEB.md to txt (if exists)
        if: hashFiles('AURORION-EULA-WEB.md') != ''
        run: |
          pandoc AURORION-EULA-WEB.md -f markdown -t plain -o AURORION-EULA-WEB.txt --wrap=none
        continue-on-error: true

      - name: Convert AURORION-PRIVACY-WEB.md to txt (if exists)
        if: hashFiles('AURORION-PRIVACY-WEB.md') != ''
        run: |
          pandoc AURORION-PRIVACY-WEB.md -f markdown -t plain -o AURORION-PRIVACY-WEB.txt --wrap=none
        continue-on-error: true

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.txt
          git commit -m "Auto-generate plain text versions from markdown

          Generated by GitHub Actions workflow

          🤖 This commit was automatically generated"
          git push
